<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 2L8 5L2 8" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .b{opacity:0}
    .l{stroke-dasharray:80;stroke-dashoffset:80}
    .b1{animation:fi .5s .2s ease both}
    .b2{animation:fi .5s .9s ease both}
    .b3{animation:fi .5s 1.6s ease both}
    .b4{animation:fi .5s 2.4s ease both}
    .b5{animation:fi .5s 3.1s ease both,glow 1.8s 3.8s ease-in-out infinite}
    .l1{animation:dl .45s .65s ease both}
    .l2{animation:dl .45s 1.35s ease both}
    .l3{animation:dl .45s 2.0s ease both}
    .l4{animation:dl .45s 2.75s ease both}
    .m1{animation:fi .4s .4s ease both}
    .m2{animation:fi .4s 1.1s ease both}
    .m3{animation:fi .4s 1.9s ease both}
    .m4{animation:fi .4s 3.3s ease both}
    @keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes dl{from{stroke-dashoffset:80}to{stroke-dashoffset:0}}
    @keyframes glow{0%,100%{opacity:1}50%{opacity:.45}}
  </style>
</defs>

<!-- Step 1 -->
<g class="b b1">
  <rect x="30" y="28" width="142" height="74" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="101" y="55"  text-anchor="middle" font-size="14" font-weight="700" fill="#1E40AF">Step 1</text>
  <text x="101" y="74"  text-anchor="middle" font-size="11" fill="#2563EB">VirtualAlloc()</text>
  <text x="101" y="90"  text-anchor="middle" font-size="10" fill="#3B82F6">PAGE_READWRITE</text>
</g>

<!-- Arrow 1→2 -->
<line class="l l1" x1="173" y1="65" x2="216" y2="65" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arr)"/>

<!-- Step 2 -->
<g class="b b2">
  <rect x="216" y="28" width="142" height="74" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="287" y="55"  text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">Step 2</text>
  <text x="287" y="74"  text-anchor="middle" font-size="11" fill="#059669">MoveMemory()</text>
  <text x="287" y="90"  text-anchor="middle" font-size="10" fill="#10B981">copy shellcode</text>
</g>

<!-- Arrow 2→3 -->
<line class="l l2" x1="358" y1="65" x2="400" y2="65" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arr)"/>

<!-- Step 3 -->
<g class="b b3">
  <rect x="400" y="28" width="156" height="74" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="478" y="55"  text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">Step 3</text>
  <text x="478" y="74"  text-anchor="middle" font-size="11" fill="#B45309">VirtualProtect()</text>
  <text x="478" y="90"  text-anchor="middle" font-size="10" fill="#D97706">PAGE_EXECUTE_READ</text>
</g>

<!-- Arrow 3→4 (down) -->
<line class="l l3" x1="478" y1="103" x2="478" y2="160" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arr)"/>

<!-- Step 4 -->
<g class="b b4">
  <rect x="368" y="160" width="240" height="74" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="488" y="187" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">Step 4</text>
  <text x="488" y="206" text-anchor="middle" font-size="11" fill="#6D28D9">CreateThread()</text>
  <text x="488" y="222" text-anchor="middle" font-size="10" fill="#7C3AED">start = shellcode addr</text>
</g>

<!-- Arrow 4→5 (down) -->
<line class="l l4" x1="478" y1="234" x2="478" y2="292" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arr)"/>

<!-- Step 5 -->
<g class="b b5">
  <rect x="368" y="292" width="240" height="74" rx="12" fill="#CCFBF1" stroke="#5EEAD4" stroke-width="1.2"/>
  <text x="488" y="319" text-anchor="middle" font-size="14" font-weight="700" fill="#134E4A">Step 5</text>
  <text x="488" y="338" text-anchor="middle" font-size="11" fill="#0F766E">WaitForSingleObject()</text>
  <text x="488" y="354" text-anchor="middle" font-size="10" fill="#14B8A6">+ CloseHandle()</text>
</g>

<!-- Memory box border -->
<rect x="30" y="148" width="300" height="224" rx="14" fill="none" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="7 4"/>
<text x="180" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#64748B">Process Memory</text>

<!-- Memory blocks -->
<g class="b m1"><rect x="52" y="190" width="256" height="36" rx="8" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="0.8"/><text x="180" y="213" text-anchor="middle" font-size="11" fill="#B91C1C">&#x2460; Allocated (RW)</text></g>
<g class="b m2"><rect x="52" y="234" width="256" height="36" rx="8" fill="#FEF9C3" stroke="#FDE047" stroke-width="0.8"/><text x="180" y="257" text-anchor="middle" font-size="11" fill="#854D0E">&#x2461; Shellcode copied (RW)</text></g>
<g class="b m3"><rect x="52" y="278" width="256" height="36" rx="8" fill="#DCFCE7" stroke="#86EFAC" stroke-width="0.8"/><text x="180" y="301" text-anchor="middle" font-size="11" fill="#166534">&#x2462; Protection &#x2192; RX &#x2713;</text></g>
<g class="b m4"><rect x="52" y="322" width="256" height="36" rx="8" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="0.8"/><text x="180" y="345" text-anchor="middle" font-size="11" fill="#3730A3">&#x2463; Thread executing &#x25B6;</text></g>

</svg>
